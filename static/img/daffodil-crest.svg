<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" fill="none">
  <!-- Outer Shield Shadow / Glow -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123DB8" />
      <stop offset="100%" stop-color="#10245A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F4B51B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="crestInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F4FF" />
    </linearGradient>
  </defs>

  <!-- Laurel Wreath Behind -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 18 68 C 12 52 14 34 26 22" />
    <path d="M 82 68 C 88 52 86 34 74 22" />
    <!-- Leaf pairs left -->
    <path d="M 15 56 Q 8 50 14 44" />
    <path d="M 17 42 Q 10 36 17 30" />
    <path d="M 22 28 Q 18 20 27 18" />
    <!-- Leaf pairs right -->
    <path d="M 85 56 Q 92 50 86 44" />
    <path d="M 83 42 Q 90 36 83 30" />
    <path d="M 78 28 Q 82 20 73 18" />
  </g>

  <!-- Outer Shield Border (Royal Blue) -->
  <path d="M 50 8 L 84 20 C 84 54 70 82 50 96 C 30 82 16 54 16 20 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" />

  <!-- Inner Shield (White / Pale Blue) -->
  <path d="M 50 14 L 79 24 C 79 52 67 76 50 89 C 33 76 21 52 21 24 Z" 
        fill="url(#crestInner)" />

  <!-- Inner Chevron / Division -->
  <path d="M 50 14 L 79 24 C 79 38 72 52 50 52 C 28 52 21 38 21 24 Z" 
        fill="url(#shieldGrad)" opacity="0.08" />

  <!-- Golden 5-point Star at Top -->
  <polygon points="50,18 53,24 59,25 55,29 56,35 50,32 44,35 45,29 41,25 47,24" 
           fill="url(#goldGrad)" stroke="#B45309" stroke-width="0.5" />

  <!-- Graduation Cap (Mortarboard) -->
  <g transform="translate(50, 42)">
    <!-- Cap Diamond -->
    <polygon points="0,-8 18,-2 0,4 -18,-2" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="1" />
    <!-- Cap Skullcap -->
    <path d="M -10 0 C -10 6 10 6 10 0" fill="url(#shieldGrad)" />
    <!-- Tassel -->
    <path d="M 0 -2 L 14 3 L 15 11" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <circle cx="15" cy="12" r="1.5" fill="url(#goldGrad)" />
  </g>

  <!-- Open Book Emblem Below -->
  <g transform="translate(50, 64)" stroke="url(#shieldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 0 3 C -6 0 -13 0 -18 3 L -18 -8 C -13 -11 -6 -11 0 -8 C 6 -11 13 -11 18 -8 L 18 3 C 13 0 6 0 0 3 Z" fill="#FFFFFF" />
    <line x1="0" y1="-8" x2="0" y2="3" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Book lines -->
    <line x1="-14" y1="-5" x2="-4" y2="-5" stroke="#93C5FD" stroke-width="1" />
    <line x1="-14" y1="-2" x2="-4" y2="-2" stroke="#93C5FD" stroke-width="1" />
    <line x1="4" y1="-5" x2="14" y2="-5" stroke="#93C5FD" stroke-width="1" />
    <line x1="4" y1="-2" x2="14" y2="-2" stroke="#93C5FD" stroke-width="1" />
  </g>

  <!-- Gear / Tech Accents -->
  <circle cx="50" cy="79" r="3.5" fill="url(#goldGrad)" />

  <!-- Golden Banner Ribbon at Base -->
  <g transform="translate(0, 88)">
    <path d="M 14 12 L 28 8 L 72 8 L 86 12 L 80 20 L 72 17 L 50 20 L 28 17 L 20 20 Z" 
          fill="url(#goldGrad)" stroke="#B45309" stroke-width="1" />
    <path d="M 28 8 L 28 17 L 34 14" fill="#B45309" />
    <path d="M 72 8 L 72 17 L 66 14" fill="#B45309" />
    <!-- Banner Text Lines -->
    <circle cx="43" cy="13" r="1.2" fill="#10245A" />
    <circle cx="50" cy="13" r="1.5" fill="#10245A" />
    <circle cx="57" cy="13" r="1.2" fill="#10245A" />
  </g>
</svg>
