{% load ums_extras %}
<div class="row g-3 mb-4">
  {% for c in cards %}
  <div class="col-sm-6 col-xl-3">
    <div class="stat-card-clean">
      <div class="stat-card-header">
        <div class="stat-icon-wrapper {% if 'fee' in c.id or 'course' in c.id or 'assign' in c.id %}gold{% else %}blue{% endif %}">
          <i data-lucide="{{ c.icon|default:'activity' }}"></i>
        </div>
        <div class="ms-auto stat-sparkline-box">
          {% sparkline_svg c.sparkline c.spark_color|default:'#123DB8' 74 30 %}
        </div>
      </div>
      
      <div class="stat-card-label">{{ c.label }}</div>
      <div class="stat-card-value">{{ c.value }}</div>
      
      <div class="stat-card-comparison">
        {% if c.delta %}
          <span class="stat-badge-trend {% if c.up %}up{% else %}down{% endif %}">
            <span>{% if c.up %}&uarr;{% else %}&darr;{% endif %}</span>
            <span>{{ c.delta }}</span>
          </span>
          <span class="stat-comparison-subtext">{{ c.comparison|default:'vs last month' }}</span>
        {% endif %}
      </div>
    </div>
  </div>
  {% endfor %}
</div>
